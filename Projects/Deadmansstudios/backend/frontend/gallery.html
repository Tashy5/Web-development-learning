<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/gallery.css">
    <title>Gallery</title>
</head>
<body>
    <h1>Welcome to the Factions</h1>
    <p>Below are factions with each minature associated in the file</p>
    <div id="gallery"></div>

  <script>
    async function fetchGallery() {
      try {
        const response = await fetch('http://localhost:5000/api/images');
        const images = await response.json();

        const galleryDiv = document.getElementById('gallery');
        galleryDiv.innerHTML = ''; // clear existing content

        images.forEach(img => {
          const imgElement = document.createElement('div');
          imgElement.innerHTML = `
            <img src="http://localhost:5000/uploads/${img.filename}" alt="${img.caption}" width="200">
            <p>${img.caption}</p>
            <p>Price: $${img.price}</p>
          `;
          galleryDiv.appendChild(imgElement);
        });

      } catch (err) {
        console.error('Error fetching gallery:', err);
      }
    }

    fetchGallery();
  </script>
</body>
</html>
